{% extends "base.html" %}
{% block content %}
<div class="card narrow">
  <h2>确认删除</h2>
  <p>确定要删除任务「{{ task.name }}」（{{ task.course }}，截止 {{ task.due_at }}）吗？该操作不可撤销。</p>
  <form method="post" action="{{ url_for('tasks.delete_task', task_id=task.id) }}">
    <div class="form-actions">
      <button type="submit" class="danger">确认删除</button>
      <a class="btn ghost" href="{{ url_for('tasks.detail', task_id=task.id) }}">取消</a>
    </div>
  </form>
</div>
{% endblock %}
